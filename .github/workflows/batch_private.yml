name: GK EN private batch (isolated)

# Isolated stock builder: renders reviewed back-of-bank questions and uploads
# them as PRIVATE YouTube drafts for owner review. Never runs on a schedule,
# never touches Instagram/Facebook/Telegram, never alters daily slot state.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: render = build stock + artifact; upload = private YouTube drafts from a render run
        type: choice
        required: true
        options:
          - render
          - upload
      count:
        description: Number of videos to render (render mode)
        default: "5"
      source_run_id:
        description: Render run ID whose artifact to upload (upload mode)
        default: ""
      question_ids:
        description: Optional comma-separated explicit question IDs to render (correction re-render)
        default: ""
      replaces_batch_id:
        description: Optional batch ID this render corrects/replaces (recorded in ledger)
        default: ""

permissions:
  contents: write
concurrency:
  group: gk-batch-private
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: inputs.mode == 'render'
        name: Install render tools with bounded Ubuntu mirror access
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
          else
            sudo find /etc/apt -maxdepth 3 -type f \( -name '*.list' -o -name '*.sources' -o -name '*mirrors*.txt' \) -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
            timeout 240 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 420 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - run: pip install -r requirements.txt
      - if: inputs.mode == 'render'
        run: python -m playwright install --with-deps chromium
      - name: Test publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Render batch stock (no state changes)
        if: inputs.mode == 'render'
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPLACES_BATCH_ID: ${{ inputs.replaces_batch_id }}
        run: |
          ARGS="--count ${{ inputs.count }}"
          if [ -n "${{ inputs.question_ids }}" ]; then ARGS="$ARGS --ids ${{ inputs.question_ids }}"; fi
          python scripts/batch_private_shorts.py render $ARGS
      - name: Upload render artifact
        if: inputs.mode == 'render'
        uses: actions/upload-artifact@v4
        with:
          name: gk-en-private-batch-${{ github.run_id }}
          path: |
            output/private_batch/*.mp4
            output/private_batch/*.jpg
            output/private_batch/manifest.json
          retention-days: 1
      - name: Download render artifact
        if: inputs.mode == 'upload'
        uses: actions/download-artifact@v4
        with:
          name: gk-en-private-batch-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/private_batch
      - name: Verify channel and upload as PRIVATE drafts
        if: inputs.mode == 'upload'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/batch_private_shorts.py upload --batch-dir output/private_batch
      - name: Commit reconciliation record (atomic, idempotent)
        if: inputs.mode == 'upload'
        run: |
          git config user.name "gk-reels-bot"
          git config user.email "actions@github.com"
          cp output/private_batch/upload_results.json /tmp/upload_results.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p output/private_batch && cp /tmp/upload_results.json output/private_batch/
            python scripts/batch_private_shorts.py reconcile --batch-dir output/private_batch
            git add data/private_batch.json data/state.json
            git diff --staged --quiet && exit 0
            git commit -m "Record private draft batch uploads [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
