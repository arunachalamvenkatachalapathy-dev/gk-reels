name: Publish GK Reels

on:
  schedule:
    # 2 videos/day — 6 AM IST & 3 PM IST (with retry slots for GitHub queue delays):
    # Morning Slot — 6:00 AM IST:
    #   - Primary: 06:00 AM IST (00:30 UTC)
    #   - Retry 1: 06:30 AM IST (01:00 UTC)
    #   - Retry 2: 07:00 AM IST (01:30 UTC)
    - cron: "30 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    # Afternoon Slot — 3:00 PM IST:
    #   - Primary: 03:00 PM IST (09:30 UTC)
    #   - Retry 1: 03:30 PM IST (10:00 UTC)
    #   - Retry 2: 04:00 PM IST (10:30 UTC)
    - cron: "30 9 * * *"
    - cron: "0 10 * * *"
    - cron: "30 10 * * *"
  repository_dispatch:
    types: [publish-reel, scheduled-publish]
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish (bypass daily quota)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit data/state.json and create releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline (render + upload)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FORCE_PUBLISH: ${{ inputs.force || github.event.client_payload.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run_pipeline.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gk-reels-video
          path: output/*.mp4
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "gk-reels-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Advance question index [skip ci]"
          git push
