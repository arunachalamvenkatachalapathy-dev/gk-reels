name: Publish GK Reels

on:
  workflow_dispatch:
  schedule:
    # GH Actions schedule is best-effort. Offset retries every 5 minutes reduce gaps;
    # state gate still allows only the earliest due, unpublished slot per run.
    # Measurements are run-start observations; missed cron occurrences have no runner to measure.
    # Morning IST window: 07:30-19:29. First retry at 07:33 IST (02:03 UTC).
    - cron: '3-58/5 2-13 * * *'
    # Evening IST window: 19:30-23:59. First retry at 19:33 IST (14:03 UTC).
    - cron: '3-58/5 14-17 * * *'
    - cron: '3-28/5 18 * * *'
permissions:
  contents: write   # needed to commit data/state.json and create releases

concurrency:
  group: gk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Use the runner's system Python and check the same IST date/slot state as
      # run_pipeline.py before downloading ffmpeg, Python packages, or Chromium.
      - name: Select due slot and measure publish-window timing
        id: slot_gate
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python3 - <<'PYGATE'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path

          IST = dt.timezone(dt.timedelta(hours=5, minutes=30))
          SLOT_OPENS = {1: dt.time(7, 30), 2: dt.time(19, 30)}
          now = dt.datetime.now(IST)
          today = now.date().isoformat()
          try:
              with open('data/state.json', encoding='utf-8') as f:
                  state = json.load(f)
              videos_per_day = int(state.get('videos_per_day', 2))
              if videos_per_day < 1:
                  raise ValueError('videos_per_day must be positive')
              pending = state.get('pending_publication')
              if pending:
                  if pending.get('date') != today:
                      raise RuntimeError('Unfinished publication from an earlier date; reconcile destinations before continuing.')
                  slot = int(pending['slot'])
                  if slot not in SLOT_OPENS:
                      raise ValueError(f'Unknown pending slot: {slot}')
                  due = now.time().replace(tzinfo=None) >= SLOT_OPENS[slot]
              else:
                  by_date = state.get('published_slots_by_date') or {}
                  if today in by_date:
                      published = {int(x) for x in by_date[today] if 1 <= int(x) <= videos_per_day}
                  elif state.get('last_published_date') == today:
                      count = max(0, min(videos_per_day, int(state.get('published_today_count', 0))))
                      published = set(range(1, count + 1))
                  else:
                      published = set()
                  slot = next((s for s in range(1, videos_per_day + 1)
                               if s not in published and s in SLOT_OPENS
                               and now.time().replace(tzinfo=None) >= SLOT_OPENS[s]), None)
                  due = slot is not None
          except Exception as exc:
              print(f'Preflight failed: {exc}', file=sys.stderr)
              sys.exit(1)

          eligible = 'true' if due else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'eligible={eligible}\n')
          record = {
              'ist_date': today,
              'eligible': due,
              'due_slot': slot if due else None,
              'slot_open_ist': SLOT_OPENS[slot].strftime('%H:%M') if due else None,
              'runner_started_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
              'runner_started_at_ist': now.isoformat(timespec='seconds'),
              'observed_start_lag_seconds_from_slot_open': int((now - dt.datetime.combine(now.date(), SLOT_OPENS[slot], tzinfo=IST)).total_seconds()) if due else None,
          }
          Path(os.environ['RUNNER_TEMP'], 'schedule-timing.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              if due:
                  line = f"Run start vs slot open: {record['observed_start_lag_seconds_from_slot_open']} sec after IST slot {slot} opened ({today} {record['slot_open_ist']} IST). This is not GitHub trigger-delivery drift."
              else:
                  line = f"No open unpublished slot at {record['runner_started_at_ist']}; no publish work."
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write(line + '\n')
          print(json.dumps(record, sort_keys=True))
          PYGATE

      - name: Set up Python
        if: steps.slot_gate.outputs.eligible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        if: steps.slot_gate.outputs.eligible == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: steps.slot_gate.outputs.eligible == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.slot_gate.outputs.eligible == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Test publication safeguards
        if: steps.slot_gate.outputs.eligible == 'true'
        run: python -m unittest discover -s tests -v

      - name: Run pipeline (render + upload)
        if: steps.slot_gate.outputs.eligible == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FORCE_PUBLISH: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run_pipeline.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.slot_gate.outputs.eligible == 'true'
        with:
          name: gk-reels-video
          path: output/*.mp4
          retention-days: 7

      - name: Upload schedule timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schedule-timing.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated state
        if: always() && steps.slot_gate.outputs.eligible == 'true'
        run: |
          git config user.name "gk-reels-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Advance question index [skip ci]"
          git push
