name: Publish GK Reels

on:
  schedule:
    # 2 videos/day with automatic retry backup triggers if GitHub delays runner queues:
    # Morning Slot:
    #   - Primary: 07:43 AM IST (02:13 UTC)
    #   - Retry 1: 08:13 AM IST (02:43 UTC)
    #   - Retry 2: 08:43 AM IST (03:13 UTC)
    - cron: "13 2 * * *"
    - cron: "43 2 * * *"
    - cron: "13 3 * * *"
    # Evening Slot:
    #   - Primary: 05:18 PM IST (11:48 UTC)
    #   - Retry 1: 05:48 PM IST (12:18 UTC)
    #   - Retry 2: 06:18 PM IST (12:48 UTC)
    - cron: "48 11 * * *"
    - cron: "18 12 * * *"
    - cron: "48 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish (bypass daily quota)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit data/state.json and create releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline (render + upload)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_PUBLISH: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run_pipeline.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gk-reels-video
          path: output/*.mp4
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "gk-reels-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Advance question index [skip ci]"
          git push
