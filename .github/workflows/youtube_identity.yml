name: Read-only Tamil YouTube credential identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth==2.35.0 google-api-python-client==2.149.0
      - name: Read OAuth channel ID and title only
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          try:
              credentials=Credentials(token=None,refresh_token=os.environ['YT_REFRESH_TOKEN'],client_id=os.environ['YT_CLIENT_ID'],client_secret=os.environ['YT_CLIENT_SECRET'],token_uri='https://oauth2.googleapis.com/token')
              youtube=build('youtube','v3',credentials=credentials)
              items=youtube.channels().list(part='id,snippet',mine=True).execute().get('items',[])
              result={'channels':[{'id':c['id'],'title':c['snippet']['title']} for c in items]}
              print(json.dumps(result,ensure_ascii=False))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:summary.write('```json\n'+json.dumps(result,ensure_ascii=False,indent=2)+'\n```\n')
          except Exception:
              raise SystemExit('Read-only channel identity check failed; no credential details printed') from None
          PY
