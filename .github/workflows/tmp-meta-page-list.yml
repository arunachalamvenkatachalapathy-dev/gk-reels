name: Temporary Meta page-list diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Query accessible page IDs and tasks
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://graph.facebook.com/v23.0/me/accounts?fields=id%2Cname%2Ctasks"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["IG_ACCESS_TOKEN"]})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              print(json.dumps([{"id": item.get("id"), "name": item.get("name"), "tasks": item.get("tasks")} for item in payload.get("data", [])], ensure_ascii=False))
          except urllib.error.HTTPError as exc:
              try:
                  error = json.loads(exc.read().decode("utf-8")).get("error", {}).get("message", "")
              except Exception:
                  error = "HTTP " + str(exc.code)
              print(error)
          except Exception as exc:
              print(type(exc).__name__ + ": " + str(exc).split(" for url:")[0])
          PY
