<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  }
  
  html, body {
    width: 1080px;
    height: 1920px;
    background: #090D16;
    color: #FFFFFF;
    overflow: hidden;
    position: relative;
  }

  /* Ambient Mesh Background */
  .bg-glow-top {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 1000px;
    height: 750px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent) 0%, transparent 70%);
    pointer-events: none;
  }
  
  .bg-glow-bottom {
    position: absolute;
    bottom: -150px;
    right: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Main Container */
  .container {
    position: relative;
    z-index: 2;
    padding: 70px 56px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Top Bar Header */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 50px;
  }

  .badge-category {
    display: flex;
    align-items: center;
    gap: 12px;
    background: color-mix(in srgb, var(--accent) 18%, rgba(255, 255, 255, 0.06));
    border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    padding: 16px 32px;
    border-radius: 100px;
    box-shadow: 0 0 25px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .badge-category .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .badge-category span {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FFFFFF;
  }

  .badge-timer {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 24px;
    font-weight: 700;
    color: #E2E8F0;
  }

  /* Question Card */
  .question-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 36px;
    padding: 56px 48px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    margin-bottom: 44px;
  }

  .question-label {
    display: inline-block;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .question-text {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.32;
    color: #FFFFFF;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  /* Options Grid */
  .options {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 40px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 26px 30px;
    border-radius: 26px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.03) 100%);
    border: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
  }

  .option .letter {
    flex: 0 0 auto;
    width: 62px;
    height: 62px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    color: #F1F5F9;
    font-size: 30px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option .text {
    font-size: 38px;
    font-weight: 700;
    color: #F8FAFC;
    line-height: 1.25;
    flex: 1;
  }

  /* Answer Revealed State */
  .option.correct {
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.45) 100%);
    border: 3.5px solid #10B981;
    box-shadow: 0 0 35px rgba(16, 185, 129, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.3);
  }

  .option.correct .letter {
    background: #10B981;
    border-color: #34D399;
    color: #FFFFFF;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
  }

  .option.correct .text {
    color: #FFFFFF;
    font-weight: 800;
    text-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
  }

  .checkmark {
    margin-left: auto;
    font-size: 42px;
    color: #10B981;
    font-weight: 900;
    text-shadow: 0 0 15px #10B981;
  }

  /* Dedicated Giveaway CTA Box */
  .giveaway-cta-card {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.14) 0%, rgba(217, 119, 6, 0.06) 100%);
    border: 2.5px dashed rgba(245, 158, 11, 0.6);
    border-radius: 28px;
    padding: 28px 36px;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: 0 12px 30px rgba(245, 158, 11, 0.15);
    margin-bottom: 30px;
  }

  .giveaway-icon {
    flex: 0 0 auto;
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
  }

  .giveaway-content {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .giveaway-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FBBF24;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .giveaway-subtitle {
    font-size: 30px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.25;
  }

  .giveaway-highlight {
    color: #FDE047;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* Answer Tag Banner (Slide 2) */
  .answer-tag-slot {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .answer-tag {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer-tag span {
    background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    color: #FFFFFF;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 14px 44px;
    border-radius: 100px;
    text-transform: uppercase;
    box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
  }

  /* Footer */
  .footer {
    margin-top: auto;
    text-align: center;
    padding-bottom: 20px;
  }

  .footer-text {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
  }
</style>
</head>
<body style="--accent: {{ACCENT}};">
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>

  <div class="container">
    <!-- Header -->
    <div class="header-bar">
      <div class="badge-category">
        <div class="dot"></div>
        <span>SSC GK QUIZ</span>
      </div>
      <div class="badge-timer">
        {{TIMER_BADGE}}
      </div>
    </div>

    <!-- Question Card -->
    <div class="question-card">
      <div class="question-label">DAILY GENERAL KNOWLEDGE</div>
      <div class="question-text">{{QUESTION}}</div>
    </div>

    <!-- Options -->
    <div class="options">
      {{OPTIONS}}
    </div>

    <!-- Answer Revealed Tag Slot (prevents layout jumping between slides) -->
    <div class="answer-tag-slot">
      {{ANSWER_TAG}}
    </div>

    <!-- Dedicated Giveaway CTA Box -->
    <div class="giveaway-cta-card">
      <div class="giveaway-icon">🎁</div>
      <div class="giveaway-content">
        <div class="giveaway-title">MONTHLY GIVEAWAY CONTEST</div>
        <div class="giveaway-subtitle">
          Comment your answer to <span class="giveaway-highlight">win monthly giveaway!</span> 💬
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-text">Follow for Daily SSC GK • Share with Friends</div>
    </div>
  </div>
</body>
</html>
