<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  }
  
  html, body {
    width: 1080px;
    height: 1920px;
    background: #0B0F19;
    color: #FFFFFF;
    overflow: hidden;
    position: relative;
  }

  .container {
    position: relative;
    z-index: 2;
    padding: 48px 52px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Vibrant Top Series Banner */
  .series-banner {
    text-align: center;
    margin-bottom: 24px;
  }

  .series-capsule {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.22) 0%, rgba(244, 63, 94, 0.16) 50%, rgba(56, 189, 248, 0.18) 100%);
    border: 2px solid rgba(245, 158, 11, 0.55);
    padding: 10px 36px;
    border-radius: 9999px;
  }

  .series-sparkle {
    font-size: 32px;
  }

  .series-title-text {
    font-family: 'Caveat', cursive;
    font-size: 52px;
    font-weight: 700;
    color: #FDE047;
    letter-spacing: 1px;
    line-height: 1;
  }

  .series-divider {
    color: rgba(255, 255, 255, 0.4);
    font-size: 26px;
  }

  .series-day-pill {
    background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    color: #0B0F19;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 9999px;
    text-transform: uppercase;
  }

  /* Top Header Bar: Channel Name Alone (Rounded Pill, No Icon, No Glow) */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .channel-brand-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #151E2E;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-bottom: 4px solid #0D131F;
    padding: 14px 36px;
    border-radius: 9999px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FFFFFF;
  }

  .badge-timer {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #151E2E;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-bottom: 4px solid #0D131F;
    padding: 14px 28px;
    border-radius: 9999px;
    font-size: 22px;
    font-weight: 800;
    color: #F1F5F9;
  }

  /* Question Card - Prioritized Hero */
  .question-card {
    background: #121A2A;
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-bottom: 6px solid #090E18;
    border-radius: 30px;
    padding: 44px 42px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
    margin-bottom: 26px;
  }

  .question-meta-row {
    display: flex;
    align-items: center;
    margin-bottom: 22px;
  }

  .question-number-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    padding: 8px 20px;
    border-radius: 9999px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #94A3B8;
    text-transform: uppercase;
  }

  .question-text {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.34;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 22px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 24px 28px;
    border-radius: 20px;
    background: #121A2A;
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-bottom: 5px solid #090E18;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  .option .letter {
    flex: 0 0 auto;
    width: 58px;
    height: 58px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    color: #FFFFFF;
    font-size: 28px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option .text {
    font-size: 34px;
    font-weight: 700;
    color: #F1F5F9;
    line-height: 1.25;
    flex: 1;
  }

  /* Answer Revealed - Clean Solid Emerald */
  .option.correct {
    background: #065F46;
    border: 2.5px solid #10B981;
    border-bottom: 5px solid #047857;
  }

  .option.correct .letter {
    background: #10B981;
    border-color: #34D399;
    color: #FFFFFF;
  }

  .option.correct .text {
    color: #FFFFFF;
    font-weight: 800;
  }

  .checkmark {
    margin-left: auto;
    font-size: 38px;
    color: #10B981;
    font-weight: 900;
  }

  /* Answer Tag Banner Slot (Slide 2) */
  .answer-tag-slot {
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .answer-tag {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer-tag span {
    background: #059669;
    color: #FFFFFF;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 10px 42px;
    border-radius: 9999px;
    text-transform: uppercase;
  }

  /* Vibrant Action Card with Color Near Giveaway */
  .community-card {
    background: #121A2A;
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-bottom: 5px solid #090E18;
    border-radius: 26px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    margin-bottom: 18px;
  }

  /* Colorful Giveaway Row */
  .community-row.giveaway-row {
    display: flex;
    align-items: center;
    gap: 18px;
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.22) 0%, rgba(234, 88, 12, 0.08) 100%);
    border: 2px solid rgba(245, 158, 11, 0.55);
    border-left: 6px solid #F59E0B;
    border-radius: 16px;
    padding: 14px 20px;
  }

  .community-chip.giveaway {
    flex: 0 0 auto;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    color: #0F172A;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .community-text {
    font-size: 27px;
    font-weight: 700;
    color: #F1F5F9;
    line-height: 1.25;
  }

  .giveaway-highlight {
    color: #FDE047;
    font-weight: 900;
  }

  /* Colorful VIP Notes Row */
  .community-row.vip-row {
    display: flex;
    align-items: center;
    gap: 18px;
    background: linear-gradient(90deg, rgba(14, 165, 233, 0.20) 0%, rgba(59, 130, 246, 0.08) 100%);
    border: 2px solid rgba(14, 165, 233, 0.45);
    border-left: 6px solid #0EA5E9;
    border-radius: 16px;
    padding: 14px 20px;
  }

  .community-chip.vip {
    flex: 0 0 auto;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
    color: #FFFFFF;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .vip-highlight {
    color: #38BDF8;
    font-weight: 900;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    text-align: center;
    padding-bottom: 12px;
  }

  .footer-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Vibrant Series Banner -->
    <div class="series-banner">
      {{SERIES_BANNER}}
    </div>

    <!-- Header Navigation Bar: Channel Name Alone (Rounder, No Icon, No Glow) -->
    <div class="header-bar">
      <div class="channel-brand-badge">
        <span>GK SNIPPETS</span>
      </div>
      <div class="badge-timer">
        {{TIMER_BADGE}}
      </div>
    </div>

    <!-- Prioritized Hero Question Card -->
    <div class="question-card">
      <div class="question-meta-row">
        <div class="question-number-badge">
          <span>{{QUESTION_TRACKER}}</span>
        </div>
      </div>
      <div class="question-text">{{QUESTION}}</div>
    </div>

    <!-- Options -->
    <div class="options">
      {{OPTIONS}}
    </div>

    <!-- Answer Revealed Slot -->
    <div class="answer-tag-slot">
      {{ANSWER_TAG}}
    </div>

    <!-- Action Card with Color Near Giveaway -->
    <div class="community-card">
      <div class="community-row giveaway-row">
        <div class="community-chip giveaway">🎁 GIVEAWAY</div>
        <div class="community-text">Follow & comment to win <span class="giveaway-highlight">FREE weekly gift</span></div>
      </div>
      <div class="community-row vip-row">
        <div class="community-chip vip">📄 VIP NOTES</div>
        <div class="community-text">Join channel for <span class="vip-highlight">updated GK PDFs & Notes</span></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-text">Daily Govt Exam Prep • Follow for More</div>
    </div>
  </div>
</body>
</html>
