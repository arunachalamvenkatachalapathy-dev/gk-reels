<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: local('Arial');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', Arial, sans-serif; }
  html, body {
    width: 1080px;
    height: 1920px;
    background: #FFFFFF;
    overflow: hidden;
  }
  .accent-bar {
    width: 100%;
    height: 140px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .accent-bar span {
    color: #FFFFFF;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .body {
    padding: 70px 64px 0 64px;
  }
  .question {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.28;
    color: #111111;
    margin-bottom: 70px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 34px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 26px;
    padding: 34px 30px;
    border-radius: 24px;
    border: 4px solid #E8E8E8;
    background: #FAFAFA;
  }
  .option.correct {
    border-color: var(--accent);
    background: #FFFDF2;
  }
  .option .letter {
    flex: 0 0 auto;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #E8E8E8;
    color: #333333;
    font-size: 34px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option.correct .letter {
    background: var(--accent);
    color: #FFFFFF;
  }
  .option .text {
    font-size: 40px;
    font-weight: 600;
    color: #222222;
    line-height: 1.3;
    padding-top: 10px;
  }
  .option.correct .text {
    color: #111111;
    font-weight: 800;
  }
  .checkmark {
    margin-left: auto;
    font-size: 40px;
    color: var(--accent);
    font-weight: 900;
  }
  .answer-tag {
    margin-top: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .answer-tag span {
    background: var(--accent);
    color: #FFFFFF;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 22px 56px;
    border-radius: 60px;
    text-transform: uppercase;
  }
  .footer {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: #AAAAAA;
    letter-spacing: 2px;
  }
</style>
</head>
<body style="--accent: {{ACCENT}};">
  <div class="accent-bar"><span>General Knowledge</span></div>
  <div class="body">
    <div class="question">{{QUESTION}}</div>
    <div class="options">
      {{OPTIONS}}
    </div>
    {{ANSWER_TAG}}
  </div>
  <div class="footer">FOLLOW FOR DAILY GK</div>
</body>
</html>
